---
name: Build from upstream repos

on:
  push:
    paths-ignore:
      - README.md

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/comment

jobs:
  load-list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3
      - id: set-matrix
        run: |
          TASKS=$(echo $(cat build.json) | sed 's/ //g' )
          echo "::set-output name=matrix::$TASKS"
  build:
    needs: [ load-list ]
    strategy:
      matrix:
        images: ${{ fromJson(needs.load-list.outputs.matrix) }}
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image tag ${{ needs.version.outputs.version_resolved }}
        uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ matrix.images.git_repo }}#${{ matrix.images.git_tag }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=${{ matrix.images.git_repo }}
            org.opencontainers.image.version=${{ matrix.images.git_tag }}
            org.opencontainers.image.builder=container-registry-manager
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.images.name }}:${{ matrix.images.tag }}
