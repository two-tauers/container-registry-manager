---
name: Push images to ghcr.io

on:
  push:
    paths-ignore:
      - README.md
      - LICENSE

env:
  REGISTRY: ghcr.io
  BUILD_MATRIX_FILE: build.json
  MIRROR_MATRIX_FILE: mirror.json

jobs:

  fetch-lists:
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.build-matrix.outputs.matrix }}
      mirror-matrix: ${{ steps.mirror-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3
      - id: build-matrix
        run: |
          TASKS=$(echo $(cat ${{ env.BUILD_MATRIX_FILE }}) | sed 's/ //g' )
          echo "::set-output name=matrix::$TASKS"
      - id: mirror-matrix
        run: |
          TASKS=$(echo $(cat ${{ env.MIRROR_MATRIX_FILE }}) | sed 's/ //g' )
          echo "::set-output name=matrix::$TASKS"

  build:
    needs: [ fetch-lists ]
    strategy:
      matrix:
        images: ${{ fromJson(needs.fetch-lists.outputs.build-matrix) }}
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image tag ${{ needs.version.outputs.version_resolved }}
        uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ matrix.images.git_repo }}#${{ matrix.images.git_tag }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=${{ matrix.images.git_repo }}
            org.opencontainers.image.version=${{ matrix.images.git_tag }}
            org.opencontainers.image.builder=container-registry-manager
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.images.name }}:${{ matrix.images.tag }}

  mirror:
    needs: [ fetch-lists ]
    strategy:
      matrix:
        images: ${{ fromJson(needs.fetch-lists.outputs.mirror-matrix) }}
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror image
        run: |
          if [ "${{ github.ref }}" == 'refs/heads/main' ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.images.name }}:${{ matrix.images.tag }} \
            ${{ matrix.images.repo }}/${{ matrix.images.name }}:${{ matrix.images.tag }} $DRY_RUN_FLAG
